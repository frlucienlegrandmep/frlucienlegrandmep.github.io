name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Google Indexing API
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          npm install googleapis --no-save
          node -e '
            const { google } = require("googleapis");
            async function indexUrl() {
              const credentials = JSON.parse(process.env.GSC_SERVICE_ACCOUNT_JSON);
              const auth = new google.auth.JWT(
                credentials.client_email,
                null,
                credentials.private_key,
                ["https://www.googleapis.com/auth/indexing"]
              );
              const indexing = google.indexing({ version: "v3", auth });
              const res = await indexing.urlNotifications.publish({
                requestBody: {
                  url: "https://frlucienlegrandmep.github.io/",
                  type: "URL_UPDATED"
                }
              });
              console.log("Google Indexing API Response:", res.data);
            }
            indexUrl().catch(err => { console.error(err); process.exit(1); });
          '
